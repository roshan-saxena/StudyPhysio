<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">StudyPhysio homepage preview</title>
  <desc id="desc">A preview of the StudyPhysio physiology practice interface with course-unit navigation and interactive checkup features.</desc>
  <rect width="1280" height="720" fill="#f4f5f3"/>

  <rect width="1280" height="72" fill="#842c29"/>
  <rect x="24" y="16" width="40" height="40" rx="9" fill="#a65c58"/>
  <path d="M36 28h16M36 36h16M36 44h16" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="617" cy="36" r="17" fill="#fff" opacity=".96"/>
  <path d="M609 42c-5-5-5-13 0-18m16 18c5-5 5-13 0-18M617 20v32" fill="none" stroke="#842c29" stroke-width="3" stroke-linecap="round"/>
  <text x="645" y="46" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">StudyPhysio</text>

  <rect y="72" width="300" height="648" fill="#fff"/>
  <rect x="299" y="72" width="1" height="648" fill="#d9dcd8"/>
  <text x="24" y="116" fill="#202522" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Course Units</text>
  <rect x="0" y="148" width="300" height="1" fill="#e5e7e4"/>

  <g fill="#262a27" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">
    <text x="25" y="190">⌄</text><text x="51" y="190">Unit 1: Pillars of Health</text>
    <text x="51" y="240" fill="#5b625e" font-weight="400">Pillar Checkup 1</text>
    <text x="51" y="278" fill="#5b625e" font-weight="400">Pillar Checkup 2</text>
    <text x="25" y="332">⌄</text><text x="51" y="332">Unit 2: Cardiovascular</text>
    <text x="51" y="370" fill="#5b625e" font-weight="400">Health Checkup</text>
    <text x="25" y="424">⌄</text><text x="51" y="424">Unit 3: Self Defense</text>
    <text x="51" y="462" fill="#5b625e" font-weight="400">Self Defense Checkup 1</text>
    <text x="51" y="500" fill="#5b625e" font-weight="400">Self Defense Checkup 2</text>
    <text x="25" y="554">⌄</text><text x="51" y="554">Unit 4: Your Brain on Drugs</text>
  </g>

  <rect x="300" y="72" width="980" height="648" fill="#f4f5f3"/>
  <rect x="350" y="105" width="880" height="550" rx="24" fill="#fff" stroke="#e2e5e1"/>
  <text x="790" y="194" text-anchor="middle" fill="#1d211e" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="800">Welcome to <tspan fill="#5a9367">Study</tspan><tspan fill="#842c29">Physio</tspan></text>
  <text x="790" y="235" text-anchor="middle" fill="#555d58" font-family="Arial, Helvetica, sans-serif" font-size="22">Master physiology through interactive practice</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="380" y="280" width="190" height="220" rx="18" fill="#fafbfa" stroke="#e5e8e4"/>
    <text x="475" y="324" text-anchor="middle" fill="#202522" font-size="19" font-weight="700">Mobile Friendly</text>
    <text x="475" y="363" text-anchor="middle" fill="#5b625e" font-size="15"><tspan x="475" dy="0">Study anywhere,</tspan><tspan x="475" dy="24">anytime on any</tspan><tspan x="475" dy="24">device.</tspan></text>

    <rect x="590" y="280" width="190" height="220" rx="18" fill="#fafbfa" stroke="#e5e8e4"/>
    <text x="685" y="324" text-anchor="middle" fill="#202522" font-size="19" font-weight="700">Detailed Review</text>
    <text x="685" y="363" text-anchor="middle" fill="#5b625e" font-size="15"><tspan x="685" dy="0">Understand every</tspan><tspan x="685" dy="24">answer with clear</tspan><tspan x="685" dy="24">explanations.</tspan></text>

    <rect x="800" y="280" width="190" height="220" rx="18" fill="#fafbfa" stroke="#e5e8e4"/>
    <text x="895" y="324" text-anchor="middle" fill="#202522" font-size="19" font-weight="700">Focused Practice</text>
    <text x="895" y="363" text-anchor="middle" fill="#5b625e" font-size="15"><tspan x="895" dy="0">Choose the topics</tspan><tspan x="895" dy="24">you want to</tspan><tspan x="895" dy="24">review.</tspan></text>

    <rect x="1010" y="280" width="190" height="220" rx="18" fill="#fafbfa" stroke="#e5e8e4"/>
    <text x="1105" y="324" text-anchor="middle" fill="#202522" font-size="19" font-weight="700">Conceptual Questions</text>
    <text x="1105" y="363" text-anchor="middle" fill="#5b625e" font-size="15"><tspan x="1105" dy="0">Practice mechanisms</tspan><tspan x="1105" dy="24">and common</tspan><tspan x="1105" dy="24">misconceptions.</tspan></text>
  </g>

  <rect x="670" y="550" width="240" height="54" rx="27" fill="#842c29"/>
  <text x="790" y="585" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Start Learning</text>
</svg>
